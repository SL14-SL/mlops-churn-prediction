name: mlops-pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: mlops-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GIT_COMMIT_SHA: ${{ github.sha }}

permissions:
  contents: read
  id-token: write

jobs:

# -------------------------------------------------
# 1️⃣ LINTING
# -------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Lint
        run: uv run ruff check .

# -------------------------------------------------
# 2️⃣ TESTING
# -------------------------------------------------
  test:
    needs: lint
    runs-on: ubuntu-latest

    env:
      APP_ENV: dev
      API_KEY: test-secret-key
      PREFECT_API_MODE: ephemeral

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Tests
        run: |
          unset PREFECT_API_URL
          uv run pytest tests/ -v --junitxml=result.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: result.xml

  # -------------------------------------------------
# 3️⃣ API SMOKE TEST
# -------------------------------------------------
  smoke-test-api:
    needs: test
    runs-on: ubuntu-latest

    env:
      APP_ENV: dev
      API_KEY: test-secret-key
      PREFECT_API_MODE: ephemeral
      MLFLOW_TRACKING_URI: http://localhost:5000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t churn-api:smoke .

      - name: Run API container
        run: |
          docker run -d \
            --name churn-api-smoke \
            -p 8080:8080 \
            -e APP_ENV=dev \
            -e API_KEY=test-secret-key \
            -e PREFECT_API_MODE=ephemeral \
            -e SMOKE_TEST=1 \
            -e MLFLOW_TRACKING_URI=http://localhost:5000 \
            -e GIT_COMMIT_SHA=${{ github.sha }} \
            churn-api:smoke

      - name: Wait for liveness
        run: |
          for i in {1..60}; do
            if ! docker ps --format '{{.Names}}' | grep -q '^churn-api-smoke$'; then
              echo "Container stopped unexpectedly"
              docker logs churn-api-smoke
              exit 1
            fi

            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/livez || true)

            if [ "$status" = "200" ]; then
              echo "API is live"
              exit 0
            fi

            echo "Waiting for API... attempt=$i status=$status"
            sleep 3
          done

          docker logs churn-api-smoke
          exit 1

      - name: Check metrics endpoint
        run: curl -fsS http://localhost:8080/metrics

      - name: Show logs on failure
        if: failure()
        run: docker logs churn-api-smoke

      - name: Stop container
        if: always()
        run: docker rm -f churn-api-smoke


