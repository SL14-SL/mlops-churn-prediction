groups:
  - name: churn-serving
    rules:
      - alert: ChurnServingBundleNotReady
        expr: >-
          (
            api_serving_ready == 0
          )
          or
          absent(
            api_serving_ready
          )
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: No complete serving bundle is active
          description: >-
            The API process is reachable, but no complete
            model and artifact bundle is ready for serving.