[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlops-churn-prediction"
version = "0.1.0"
description = "Production-oriented customer churn prediction system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.40.0",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "python-dotenv>=1.2.1",
    "pandera==0.29.0",
    "scikit-learn==1.8.0",
    "scipy==1.17.0",
    "xgboost==3.1.3",
    "mlflow==3.15.1",
    "mlflow-skinny==3.15.1",
    "mlflow-tracing==3.15.1",
    "prefect==3.7.2",
    "prometheus-fastapi-instrumentator>=7.1.0",
    # GCP-first blueprint dependencies
    "gcsfs==2026.2.0",
    "google-cloud-aiplatform>=1.139.0",
    "google-cloud-bigquery>=3.40.1",
    "google-cloud-bigquery-storage>=2.36.2",
    "google-cloud-run>=0.15.0",
    "google-cloud-storage>=3.9.0",
    "db-dtypes>=1.5.0",
    "pyasn1>=0.6.4",
    "prometheus-client==0.23.1",
    "pillow>=12.3.0",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "streamlit>=1.57.0",
    "plotly>=6.7.0",
    "gitpython>=3.1.60,<4",
    "mako>=1.3.12",
    "fastapi-swagger-ui-theme>=0.1.0",
    # Explicit security constraints for transitive dependencies
    "cryptography==49.0.0",
    "msgpack>=1.2.1,<2",
    "setuptools>=78.1.1",
    "aiohttp>=3.14.3",
    "python-multipart>=0.0.30",
    "starlette==1.3.1",
    "sqlparse>=0.6.0",
    "urllib3>=2.7.0",
    "numpy<2.4",
    "fsspec==2026.2.0",
    "pydantic>=2.12,<3",
    "pyyaml>=6,<7",
]


[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pip-audit==2.10.1",
    "pytest==9.0.3",
    "ruff==0.15.22",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["notebooks"]

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_churn_prediction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-ra --import-mode=importlib"
filterwarnings = [
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette\\.testclient",
    "ignore:The set_bad function will be deprecated.*:PendingDeprecationWarning:shap\\.plots\\.colors\\._colors",
    "ignore:The set_over function will be deprecated.*:PendingDeprecationWarning:shap\\.plots\\.colors\\._colors",
    "ignore:The set_under function will be deprecated.*:PendingDeprecationWarning:shap\\.plots\\.colors\\._colors",
]
